{% extends "web/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<header class="page-head"><div><h1>Change password</h1></div></header>
<section class="panel">
  <form method="post" class="settings-form" hx-boost="false">{% csrf_token %}
    {% for field in form %}{% for error in field.errors %}<p class="form-error" role="alert">{{ error }}</p>{% endfor %}{% endfor %}
    <label>Current password <input type="password" name="old_password" autocomplete="current-password" autofocus required></label>
    <label>New password <input type="password" name="new_password1" autocomplete="new-password" required></label>
    <label>New password again <input type="password" name="new_password2" autocomplete="new-password" required></label>
    <div><button class="btn primary">Change password</button></div>
  </form>
</section>
{% endblock %}
