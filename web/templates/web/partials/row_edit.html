<tr id="row-{{ row.table }}-{{ row.pk }}" class="editing">
  <td colspan="{{ span }}">
    <form class="edit-form" hx-post="{% url 'web:row_edit' row.table row.pk %}" hx-target="closest tr" hx-swap="outerHTML"
          x-data @keydown.escape.stop="$refs.cancel.click()">
      {% for f in fields %}
        <label>{{ f.label }}
          {% if f.type == "select" %}
            <select name="{{ f.name }}">{% for value, label in f.choices %}<option value="{{ value }}"{% if value == f.value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select>
          {% elif f.type == "textarea" %}
            <textarea name="{{ f.name }}" rows="3">{{ f.value }}</textarea>
          {% elif f.type == "datetime" %}
            <input type="datetime-local" name="{{ f.name }}" value="{{ f.value }}">
          {% elif f.type == "date" %}
            <input type="date" name="{{ f.name }}" value="{{ f.value }}" required>
          {% elif f.type == "number" %}
            <input type="number" step="any" name="{{ f.name }}" value="{{ f.value }}" required>
          {% else %}
            <input type="text" name="{{ f.name }}" value="{{ f.value }}"{% if f.hint %} placeholder="{{ f.hint }}"{% endif %}>
          {% endif %}
        </label>
      {% endfor %}
      <div class="edit-buttons">
        <button class="btn primary">Save</button>
        <button type="button" class="btn" x-ref="cancel" hx-get="{% url 'web:row' row.table row.pk %}"
                hx-target="closest tr" hx-swap="outerHTML">Cancel</button>
      </div>
      {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    </form>
  </td>
</tr>
